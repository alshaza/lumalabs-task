display_information:
  name: Styled Shots
  description: Request styled product photos from the catalog, generated via Luma.
features:
  bot_user:
    display_name: styled-shots
    always_online: true
  slash_commands:
    - command: /shot-request
      url: https://lumalabs-task-production.up.railway.app/slack/commands
      description: Request a styled shot for a product
      should_escape: false
    - command: /catalog-sync
      url: https://lumalabs-task-production.up.railway.app/slack/commands
      description: Sync the product catalog from a CSV
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - files:read
      - channels:history
      - users:read
settings:
  event_subscriptions:
    request_url: https://lumalabs-task-production.up.railway.app/slack/events
    bot_events:
      - message.channels
  interactivity:
    is_enabled: true
    request_url: https://lumalabs-task-production.up.railway.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
